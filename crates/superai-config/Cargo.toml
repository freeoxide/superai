[package]
name = "superai-config"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false
repository.workspace = true
description = "Layer 1: per-harness config files — read fresh, edit, back up, write back preserving unmodelled keys."

# cargo bench must run only the criterion target; the lib's unittest
# harness would otherwise receive criterion-only flags like --save-baseline.
[lib]
bench = false

[dependencies]
memchr = "2"
serde = { workspace = true }
serde_json = { workspace = true }
toml_edit = { workspace = true }
thiserror = { workspace = true }
yaml-serde = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "hot_lanes"
harness = false
